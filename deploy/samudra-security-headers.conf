# Samudra Manthanam — HTTPS-only security headers (H2398 / Wave P10b)
#
# Include this ONLY inside `listen 443 ssl` server blocks.
# Repeat the include inside every location that already uses add_header
# (nginx does not inherit add_header into those).
# Never include this file in a listen-80 server — HSTS on HTTP-only is
# the H2398 fail condition (browsers would pin clients to a host they
# cannot reach if TLS is down).
#
# Install:
#   cp deploy/samudra-security-headers.conf /etc/nginx/snippets/samudra-security-headers.conf
#   python3 scripts/enable_security_headers.py --apply

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header X-Frame-Options           "SAMEORIGIN" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
