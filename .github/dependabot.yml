version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
    groups:
      github-actions-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "08:15"
      timezone: Europe/Moscow
    open-pull-requests-limit: 10
    ignore:
      # H7160: pydantic-settings >=2.16 requires Python >=3.11; the CI test
      # matrix deliberately keeps a 3.10 leg. Drop this ignore when 3.10 goes.
      - dependency-name: pydantic-settings
        versions: [">=2.16"]
      # H7934: sse-starlette >=3.6.0 requires Python >=3.11. #443 capped this,
      # #447 re-bumped it and merged red on the 3.10 leg. Drop when 3.10 goes.
      - dependency-name: sse-starlette
        versions: [">=3.6"]
      # H7934: python-multipart >=0.0.33 requires Python >=3.11; same class.
      # Drop when 3.10 goes.
      - dependency-name: python-multipart
        versions: [">=0.0.33"]
    groups:
      python-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /nkrya-parallel
    schedule:
      interval: weekly
      day: monday
      time: "08:30"
      timezone: Europe/Moscow
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:45"
      timezone: Europe/Moscow
    open-pull-requests-limit: 10
    groups:
      docker-minor-patch:
        update-types:
          - minor
          - patch
