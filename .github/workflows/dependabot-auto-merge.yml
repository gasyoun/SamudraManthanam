name: Dependabot auto-merge

# Hands-off merge of Dependabot pull requests. When all required checks pass
# GitHub merges the PR by itself; on repos with no required checks the PR is
# squash-merged directly. To hold back major bumps for human review, gate the
# Approve + Enable steps on:
#   steps.meta.outputs.update-type != 'version-update:semver-major'
# Deployed by /cologne-dependabot-automerge-all.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    name: Auto-merge Dependabot PRs
    runs-on: ubuntu-latest
    if: ${{ github.actor == 'dependabot[bot]' }}
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # H7934: never merge a dependency PR whose CI is red or still running.
      # #443 capped sse-starlette for the 3.10 leg; #447 re-bumped it (plus
      # python-multipart) to >=3.11-only versions and this workflow squash-
      # merged it 28s after the 3.10 job went red. Poll the CI workflow on the
      # head SHA; only a completed success proceeds to approve/merge.
      - name: Wait for CI on the head SHA (H7934)
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          HEAD_SHA: "${{ github.event.pull_request.head.sha }}"
          REPO: "${{ github.repository }}"
        run: |
          for i in $(seq 1 60); do
            line=$(gh run list --repo "$REPO" --workflow ci.yml --commit "$HEAD_SHA" \
              --json databaseId,status,conclusion,createdAt \
              --jq 'first | if . == null then empty else "\(.status) \(.conclusion // "-")" end' || true)
            if [ -n "$line" ]; then
              status=${line%% *}; conclusion=${line#* }
              if [ "$status" = "completed" ]; then
                if [ "$conclusion" = "success" ]; then
                  echo "CI green on $HEAD_SHA — proceeding to merge"
                  exit 0
                fi
                echo "::error::CI $conclusion on $HEAD_SHA — refusing to auto-merge (H7934)"
                exit 1
              fi
            fi
            sleep 30
          done
          echo "::error::CI did not complete on $HEAD_SHA within 30 min — not merging (H7934)"
          exit 1

      - name: Approve the PR
        run: gh pr review --approve "$PR_URL" || true
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge (falls back to a direct squash-merge where no required checks exist)
        run: gh pr merge --auto --squash "$PR_URL" || gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
