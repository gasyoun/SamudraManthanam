name: wisdomlib gentle crawl

# Stage C content download for the wisdomlib crawler, run ON DEMAND on a
# SELF-HOSTED runner. Each dispatch does one bounded, gentle, resumable pass.
#
# WHY self-hosted + manual (decided 2026-06-19)
#  - GitHub-hosted (Azure datacenter) IPs are Cloudflare-blocked for wisdomlib:
#    3/3 dispatched test runs downloaded 0 pages. So the hourly cron was removed —
#    it only produced empty no-ops.
#  - The ONLY egress that gets past Cloudflare's per-IP block is a residential
#    connection, so this must run on a self-hosted runner installed on a real
#    home machine. Set one up via repo Settings > Actions > Runners, then trigger
#    this workflow manually. It stays subject to the per-IP rate limit, hence the
#    gentle defaults (--workers 1 --delay 5); run repeatedly to make progress
#    (resumable via the content cache).
#  - workflow_dispatch only fires for the copy of this file on the DEFAULT branch
#    (main); the crawler code is now on main too (offline-search merged in).
#  - Output is cached + uploaded as an artifact, NEVER committed: wisdomlib has
#    no bulk-reuse licence (content/ stays unpublished).

on:
  workflow_dispatch:
    inputs:
      lang:
        description: "source language filter (comma-list allowed)"
        default: "sanskrit"
        type: string
      section:
        description: "topic section filter (comma-list, optional)"
        default: ""
        type: string
      ctype:
        description: "content type filter (comma-list, optional)"
        default: ""
        type: string
      slug:
        description: "explicit slug filter (comma-list, optional)"
        default: ""
        type: string
      english:
        description: "only entries with English translation"
        default: false
        type: boolean
      pali_mode:
        description: "Pali filter"
        default: "any"
        type: choice
        options:
          - any
          - only
          - exclude
      min_words:
        description: "minimum word count"
        default: "0"
        type: string
      limit:
        description: "maximum selected entries (0 = no limit)"
        default: "0"
        type: string
      workers:
        description: "concurrent workers"
        default: "1"
        type: string
      delay:
        description: "per-request delay seconds (jittered)"
        default: "5"
        type: string

permissions:
  contents: read

concurrency:
  group: wisdomlib-crawl            # never overlap two crawl runs
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: self-hosted           # residential runner — GitHub IPs are CF-blocked
    timeout-minutes: 60             # bound each pass
    defaults:
      run:
        working-directory: web/corpus_builder/wisdomlib
    steps:
      - uses: actions/checkout@v7   # crawler code now on the default branch (merged)

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install "httpx[http2]"

      # Restore previously downloaded chapters so each run resumes. The unique
      # run-id key always writes a fresh cache; restore-keys pulls the latest.
      - name: Restore content cache
        uses: actions/cache@v4
        with:
          path: web/corpus_builder/wisdomlib/content
          key: wisdomlib-content-${{ github.run_id }}
          restore-keys: wisdomlib-content-

      - name: Gentle Stage C pass
        env:
          WL_LANG: ${{ inputs.lang }}
          WL_SECTION: ${{ inputs.section }}
          WL_CTYPE: ${{ inputs.ctype }}
          WL_SLUG: ${{ inputs.slug }}
          WL_ENGLISH: ${{ inputs.english }}
          WL_PALI_MODE: ${{ inputs.pali_mode }}
          WL_MIN_WORDS: ${{ inputs.min_words }}
          WL_LIMIT: ${{ inputs.limit }}
          WL_WORKERS: ${{ inputs.workers }}
          WL_DELAY: ${{ inputs.delay }}
        run: |
          python workflow_stagec.py
          python crawl.py report || true

      - name: Show progress
        if: always()
        run: |
          echo "downloaded chapter files:"
          find content -name 'doc*.html' 2>/dev/null | wc -l

      - name: Upload content artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wisdomlib-content
          path: web/corpus_builder/wisdomlib/content
          retention-days: 30
          if-no-files-found: ignore
