name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_TARGETS: >-
    docs_site
    papers/scripts
    web/app
    web/corpus_builder
    web/ingest
    web/scripts
    web/tests

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install ruff
        run: python -m pip install ruff
      - name: Critical errors
        run: ruff check --select=E9,F63,F7,F82 --output-format=github $PYTHON_TARGETS
      - name: Style report (warnings only)
        run: ruff check --output-format=github $PYTHON_TARGETS || true

  format-check:
    name: Format check (black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install black
        run: python -m pip install black
      - name: Check executable Python directories
        run: black --check --diff $PYTHON_TARGETS || echo "::warning::Formatting drift — run Black locally to fix"

  test:
    name: Pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: web
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: web/requirements.txt
      - name: Install application and test dependencies
        run: python -m pip install -r requirements.txt pytest pytest-asyncio pytest-timeout
      - name: Run hermetic tests
        run: python -m pytest -m "not corpus" -v --tb=short

  npm:
    name: npm build and high-severity audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nkrya-parallel
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: nkrya-parallel/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build

  dependency-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: web/requirements.txt
      - name: Audit pinned runtime dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r web/requirements.txt

  docker-build:
    name: Docker runtime image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build hardened runtime image
        run: docker build --tag samudra-manthanam:ci .

  yaml-lint:
    name: YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install pyyaml
      - name: Validate all YAML
        run: |
          python -c "
          import sys, glob, yaml
          fail = 0
          for f in glob.glob('**/*.yml', recursive=True) + glob.glob('**/*.yaml', recursive=True):
              if '.git' in f: continue
              try:
                  with open(f, encoding='utf-8') as fh: yaml.safe_load(fh)
              except yaml.YAMLError as e:
                  print(f'::error file={f}::{e}'); fail = 1
          sys.exit(fail)
          "
