name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_TARGETS: >-
    docs_site
   
    web/app
    web/corpus_builder
    web/ingest
    web/scripts
    web/tests

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
      - name: Install ruff
        run: python -m pip install ruff
      - name: Critical errors
        run: ruff check --select=E9,F63,F7,F82 --output-format=github $PYTHON_TARGETS
      - name: Style report (warnings only)
        run: ruff check --output-format=github $PYTHON_TARGETS || true

  format-check:
    name: Format check (black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
      - name: Install black
        run: python -m pip install black
      - name: Check executable Python directories
        run: black --check --diff $PYTHON_TARGETS || echo "::warning::Formatting drift — run Black locally to fix"

  test:
    name: Pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 is the PRODUCTION runtime (Dockerfile FROM python:3.14-slim).
        # It was absent from this matrix until H1927, so every release shipped
        # on a version CI had never executed. tests/test_runtime_alignment.py
        # fails if the Dockerfile's version ever leaves this list again.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: web
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: web/requirements.txt
      - name: Install application and test dependencies
        run: python -m pip install -r requirements.txt pytest pytest-asyncio pytest-timeout
      - name: Run hermetic tests
        run: python -m pytest -m "not corpus" -v --tb=short

  npm:
    name: npm build and high-severity audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nkrya-parallel
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: nkrya-parallel/package-lock.json
      - run: npm ci
      # High/critical audit gate with reviewed exceptions (H6378). Mirrors the
      # .paper-priv-allowlist pattern: every exception carries a GHSA id, an
      # expiry date, and a reason. An expired exception FAILS the gate, so an
      # exception can never silently become permanent — fix the dependency or
      # re-review with a fresh date. Non-allowlisted high/critical always fails.
      - name: npm audit (high/critical, reviewed exceptions)
        run: |
          node <<'EOF'
          const { execFileSync } = require('child_process');
          const EXCEPTIONS = [
            {
              ghsa: 'GHSA-vfj7-8cjw-p6xm', // braces <=3.0.3 stack-exhaustion DoS
              until: '2027-01-11',
              reason: 'no patched braces release exists (advisory firstPatchedVersion: null); braces reaches this tree only as a build-time glob dep of the static site generator — never shipped runtime code',
            },
          ];
          const today = new Date().toISOString().slice(0, 10);
          let audit;
          try {
            audit = JSON.parse(execFileSync('npm', ['audit', '--omit=dev', '--json'], { encoding: 'utf8' }));
          } catch (e) {
            audit = JSON.parse(e.stdout); // npm audit exits non-zero when findings exist
          }
          const blocking = [];
          for (const [name, info] of Object.entries(audit.vulnerabilities || {})) {
            if (!['high', 'critical'].includes(info.severity)) continue;
            for (const via of info.via || []) {
              if (typeof via !== 'object') continue;
              const id = (via.url || '').split('/').pop();
              const ex = EXCEPTIONS.find((x) => x.ghsa === id);
              if (!ex) { blocking.push(`${name}: ${via.title} (${id})`); continue; }
              if (today > ex.until) { blocking.push(`${name}: exception for ${id} EXPIRED ${ex.until} — fix the dependency or re-review with a new date`); continue; }
              console.log(`::warning::audit exception ${name} (${id}, until ${ex.until}): ${ex.reason}`);
            }
          }
          if (blocking.length) {
            console.error('::error::npm audit blocking high/critical finding(s):\n' + blocking.join('\n'));
            process.exit(1);
          }
          console.log('npm audit: OK — no high/critical findings outside reviewed exceptions');
          EOF
      - run: npm run build

  dependency-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: web/requirements.txt
      - name: Audit pinned runtime dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r web/requirements.txt

  docker-build:
    name: Docker runtime image + deployment contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build hardened runtime image
        run: docker build --tag samudra-manthanam:ci .

      # H1927 / Lane D3-D4. Building the image proved only that it builds.
      # These steps boot it against fixture databases and run the SAME contract
      # the bare systemd/nginx profile runs in deployment-contract-bare.yml —
      # one script, one definition of "this deployment works".
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"
      - name: Build fixture databases
        run: |
          python -m pip install -r web/requirements.txt
          mkdir -p fixtures
          PYTHONPATH=web python web/scripts/build_fixture_db.py \
            --corpus-db fixtures/corpus.db --state-db fixtures/state.db
          chmod -R a+rw fixtures

      - name: Boot the image against fixtures
        run: |
          docker run -d --name samudra-ci -p 8000:8000 \
            -v "$PWD/fixtures/corpus.db:/app/corpus.db" \
            -v "$PWD/fixtures/state.db:/app/state.db" \
            -e STATE_DB_PATH=/app/state.db \
            -e APP_ENV=production \
            samudra-manthanam:ci

      - name: Deployment contract smoke (docker profile)
        run: |
          python web/scripts/deployment_contract_smoke.py \
            --base-url http://127.0.0.1:8000 \
            --profile docker \
            --json-report docker-contract-report.json

      - name: Container logs on failure
        if: failure()
        run: docker logs samudra-ci

      - name: Clean stop
        if: always()
        run: |
          docker stop --timeout 20 samudra-ci
          # D4 "clean stop/rollback behaviour": uvicorn must exit on SIGTERM
          # rather than be killed after the timeout. 137 = SIGKILL.
          code=$(docker inspect -f '{{.State.ExitCode}}' samudra-ci)
          echo "container exit code: $code"
          docker rm samudra-ci
          test "$code" != "137" || { echo "::error::container had to be SIGKILLed — unclean shutdown"; exit 1; }

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: docker-contract-report
          path: docker-contract-report.json
          if-no-files-found: ignore

  yaml-lint:
    name: YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
      - run: python -m pip install pyyaml
      - name: Validate all YAML
        run: |
          python -c "
          import sys, glob, yaml
          fail = 0
          for f in glob.glob('**/*.yml', recursive=True) + glob.glob('**/*.yaml', recursive=True):
              if '.git' in f: continue
              try:
                  with open(f, encoding='utf-8') as fh: yaml.safe_load(fh)
              except yaml.YAMLError as e:
                  print(f'::error file={f}::{e}'); fail = 1
          sys.exit(fail)
          "
