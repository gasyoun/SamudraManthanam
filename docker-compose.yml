services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: samudra_manthanam_web
    init: true
    ports:
      - "8000:8000"
    volumes:
      # Source corpus is an optional read-only runtime reference.
      - ./corpus:/corpus:ro
      # Writable DB: the host file must exist and be writable by UID/GID 10001.
      - ./web/corpus.db:/app/corpus.db
      # Generated browser packs are served but never mutated by the container.
      - ./web/offline-packs:/app/offline-packs:ro
    environment:
      APP_ENV: ${APP_ENV:-production}
      CORPUS_PATH: /corpus
      DB_PATH: /app/corpus.db
      OFFLINE_PACKS_DIR: /app/offline-packs
    restart: unless-stopped
